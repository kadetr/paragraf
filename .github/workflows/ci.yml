name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install dependencies
        run: npm ci

      # Fonts are committed to the repository under fonts/.
      # This step verifies that all files are present and match their expected
      # SHA-256 hashes, catching any accidental corruption or truncation.
      - name: Verify fonts
        run: npm run verify-fonts

      - name: Build WASM (nodejs target — used by unit tests)
        run: wasm-pack build --target nodejs --out-dir pkg
        working-directory: 2a-shaping-wasm/wasm

      - name: Build WASM (bundler target — used by demo)
        run: wasm-pack build --target bundler --out-dir pkg-bundler
        working-directory: 2a-shaping-wasm/wasm

      - name: Build packages
        run: npm run build

      # Vitest strips types, so a passing test run does not prove the code
      # type-checks. This step runs tsc --noEmit in every workspace.
      - name: Type check (all workspaces)
        run: npm run typecheck

      - name: Run unit tests (all workspaces)
        run: npm test --workspaces --if-present

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Run WASM/TS parity test (MT-11)
        run: npx tsx tests/manual/scripts/mt-11-wasm-ts-parity.ts

      # What users install is the tarball, not the workspace. These two steps
      # pack every package, check the contents, install the tarballs into an
      # empty project outside the repo and compile a PDF from them.
      - name: Pack check
        run: node scripts/pack-check.mjs --out "$RUNNER_TEMP/tarballs"

      - name: Smoke test from the packed tarballs
        run: node scripts/smoke-test.mjs "$RUNNER_TEMP/tarballs"
