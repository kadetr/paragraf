name: Release

# Publishes all @paragraf/* packages to npm.
#
# A real publish happens only when a tag vX.Y.Z is pushed, the tag matches the
# package version, and the tagged commit is on main.
# Starting the workflow by hand from the Actions tab is always a dry run:
# everything is built, tested, packed and smoke-tested, and nothing is uploaded.
#
# Publishing uses npm trusted publishing (OIDC). Each of the 13 packages needs a
# trusted publisher on npmjs.com for this repository (kadetr/paragraf), this
# workflow file (release.yml) and the environment "npm", allowed to run direct
# `npm publish`. The publish job asks GitHub for a short-lived OIDC token
# (permission id-token: write) and the npm CLI exchanges it for a publish
# credential; provenance is attached automatically. This needs npm >= 11.5.1
# and Node >= 22.14.0, so the job installs a pinned npm 11.
#
# Transition: the secret NPM_TOKEN of the environment "npm" is still
# passed as NODE_AUTH_TOKEN. The npm CLI tries OIDC first and falls back to the
# token. Remove it after the first release that publishes through OIDC (see the
# TODO on the Publish step).
#
# The publish job runs in the GitHub environment "npm". Add required reviewers
# to that environment (Settings → Environments) to get an approval prompt
# before anything is uploaded.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Tag must be a plain version, match the packages, and be on main
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./0-types/package.json').version")
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag $GITHUB_REF_NAME is not vX.Y.Z; pre-releases are not published by this workflow." >&2
            exit 1
          fi
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install dependencies
        run: npm ci

      - name: Verify fonts
        run: npm run verify-fonts

      - name: Build WASM (nodejs target)
        run: wasm-pack build --target nodejs --out-dir pkg --release
        working-directory: 2a-shaping-wasm/wasm

      # Not shipped; the demo workspace needs it to build.
      - name: Build WASM (bundler target)
        run: wasm-pack build --target bundler --out-dir pkg-bundler --release
        working-directory: 2a-shaping-wasm/wasm

      - name: Build packages
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test --workspaces --if-present

      - name: End-to-end and golden tests
        run: npm run test:e2e

      - name: Pack check
        run: node scripts/pack-check.mjs --out "$RUNNER_TEMP/tarballs"

      - name: Smoke test from the packed tarballs
        run: node scripts/smoke-test.mjs "$RUNNER_TEMP/tarballs"

      - name: Keep the checked tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error

  # Only this job can sign provenance and publish. It publishes the tarballs
  # the build job checked, not a rebuild.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x; trusted publishing needs npm >= 11.5.1. Pinned
      # to an exact version so a release does not change with the latest npm.
      - name: Use npm 11 (trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@11.21.2
          npm --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: tarballs

      - name: Publish (dry run)
        if: github.event_name != 'push'
        run: node scripts/publish-tarballs.mjs tarballs --dry-run

      - name: Publish
        if: github.event_name == 'push'
        run: node scripts/publish-tarballs.mjs tarballs
        env:
          # TODO: remove this env block (and the NPM_TOKEN secret) after the
          # first release that publishes via trusted publishing succeeds. The
          # token is only a fallback; npm tries OIDC first.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
